            document.getElementById('entryCount').textContent = `${visibleCount.toLocaleString()} Entries`;

            updateDebugInfo();
        }

        // Render cache debug info in the toolbar.
        let debugUpdatePending = false;
        function updateDebugInfo() {
            if (debugUpdatePending) return;
            debugUpdatePending = true;
            requestAnimationFrame(() => {
                debugUpdatePending = false;
                const debugEl = document.getElementById('debugInfo');
                if (!debugEl) return;

                const rawCount = rawCache.length;
                const hotCount = hotBuffer.length;
                const offlineTotal = offlineBuffer.logs.length;
                const continuous = isCacheContinuous();
                const allRows = logTableBody.querySelectorAll('tr[data-log-id]');
                let visibleDom = 0;
                allRows.forEach(row => { if (row.style.display !== 'none') visibleDom++; });

                const rate = getLogRate();

                debugEl.textContent =
                    `Rate:${rate.toLocaleString()}/s ` +
                    `All:${rawCount.toLocaleString()} ` +
                    `Visible:${hotCount.toLocaleString()} ` +
                    `History:${offlineTotal.toLocaleString()} ` +
                    `Shown:${visibleDom}/${allRows.length} ` +
                    `IDs:${displayMinId ?? '-'}~${displayMaxId ?? '-'} ` +
                    `${continuous ? 'Connected' : 'Gap'}`;

                debugEl.title =
                    `Rate: ${rate.toLocaleString()} logs/sec (last 1s)\n` +
                    `All (raw cache): ${rawCount.toLocaleString()}\n` +
                    `Visible (after filters): ${hotCount.toLocaleString()}\n` +
                    `History (offline cache): ${offlineTotal.toLocaleString()}\n` +
                    `Shown in table: ${visibleDom.toLocaleString()} / ${allRows.length.toLocaleString()}\n` +
                    `Displayed _id range: ${displayMinId ?? '-'} ~ ${displayMaxId ?? '-'}\n` +
                    `Cache continuity: ${continuous ? 'OK' : 'broken — history will be refetched when scrolling up'}`;
            });
        }

        // **rewritten, more optimized code**
        function loadMoreLogs() {
            if (isLoading) return;

            // 1. Hot buffer has older visible logs not yet displayed?
            if (hotBuffer.length > 0 && displayMinId > hotBuffer[0]._id) {
                console.log("Loading more logs from hot buffer...");
                updateDisplayFromCache();
                return;
            }

            // 2. Offline buffer has older history?
            if (offlineBuffer.logs.length > 0 && displayMinId > offlineBuffer.startId) {
                console.log("Loading more logs from offline buffer...");
                updateDisplayFromCache();
                return;
            }

            // 3. Fetch from backend
            if (hasMoreLogs) {
                console.log("Fetching more logs from server...");
                const startId = displayMinId || hotBuffer[0]?._id || rawCacheMinId;
                if (startId === null || startId === 0) {
                    hasMoreLogs = false;
                    return;
                }
                fetchLogsToCache(startId, -currentLimit, true)
                    .then(() => updateDisplayFromCache());
            } else {
                console.log("No more logs on server.");
            }
        }

            // refresh column options after log loading
        function loadInitialData() {
            updateStats();
            fetchLogsToCache(null, currentLimit)
                .then(data => {
                    updateDisplayFromCache({ reset: true });
                    if (data.logs && data.logs.length) {
                        setTimeout(() => scrollToBottom(), 100);
                    }

                    // refresh column options after log loading
                    refreshColumnOptions();

                    // try to set default module hierarchy
                    if (availableColumns.includes('module')) {
                        document.getElementById('moduleLevel1').value = 'module';
                    }

                    setupEventSource();
                })
                .catch(error => {
                    console.error('Initial log load failed, starting SSE without last_log_id', error);
                    setupEventSource();
                });
        }

        // **REFACTORED**: Merge data into cache
        function setupEventSource() {
            if (eventSource) eventSource.close();
            updateConnectionStatus('connecting');

            // Use rawCacheMaxId as the starting point for streaming
            const lastId = rawCacheMaxId !== null ? rawCacheMaxId : -1;

            const params = new URLSearchParams();
            params.append('last_log_id', lastId);

            const url = `/logger/api/stream?${params.toString()}`;
            eventSource = new EventSource(url);

            eventSource.onopen  = () => updateConnectionStatus('connected');
            eventSource.onerror = () => {
                updateConnectionStatus('error');
                eventSource.close();
                setTimeout(setupEventSource, 5000);
            };

            eventSource.onmessage = (event) => {
                if (!document.getElementById('autoRefresh').checked) return;
                try {
                    const raw  = JSON.parse(event.data);
                    const logs = Array.isArray(raw) ? raw : [raw];

                    if (logs.length > 0) {
                        mergeLogsToCache(logs);
                        if (viewMode === 'live') {
                            updateDisplayFromCache();
                            if (autoScrollEnabled && isNearBottom) scrollToBottom();
                        }
                        // In history mode new logs are silently merged into the cache.
                        // They are rendered incrementally as the user scrolls back down.
                    }

                } catch (e) { console.error('SSE parse error', e); }
            };
        }

        // ----------------------------------------- Filter Related -----------------------------------------

        // module hierarchy config
        let moduleLevel1 = 'module';
        let moduleLevel2 = 'name';
        let moduleLevel3 = 'funcName';

        let selectedLevels = ['DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'];
        let selectedModules = [];

        // store mapping of whether node has children
        let nodeHasChildrenMap = new Map();
        // store all node paths
        let allModulePaths = [];

        // refresh column option dropdowns
        function refreshColumnOptions() {
            const level1Select = document.getElementById('moduleLevel1');
            const level2Select = document.getElementById('moduleLevel2');
            const level3Select = document.getElementById('moduleLevel3');

            // save currently selected values
            const currentLevel1 = level1Select.value;
            const currentLevel2 = level2Select.value;
            const currentLevel3 = level3Select.value;

            // clear options
            level1Select.innerHTML = '<option value="">-- Select Column --</option>';
            level2Select.innerHTML = '<option value="">-- Select Column --</option>';
            level3Select.innerHTML = '<option value="">-- Select Column --</option>';

            // add new options
            availableColumns.forEach(column => {
                const option1 = document.createElement('option');
                option1.value = column;
                option1.textContent = column;
                if (column === currentLevel1) option1.selected = true;
                level1Select.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = column;
                option2.textContent = column;
                if (column === currentLevel2) option2.selected = true;
                level2Select.appendChild(option2);

                const option3 = document.createElement('option');
                option3.value = column;
                option3.textContent = column;
                if (column === currentLevel3) option3.selected = true;
                level3Select.appendChild(option3);
            });

            document.getElementById('moduleLevel1').value = moduleLevel1;
            document.getElementById('moduleLevel2').value = moduleLevel2;
            document.getElementById('moduleLevel3').value = moduleLevel3;
        }

        // generate module tree
        function generateModuleTree() {
            const level1 = document.getElementById('moduleLevel1').value;
            const level2 = document.getElementById('moduleLevel2').value;
            const level3 = document.getElementById('moduleLevel3').value;

            if (!level1 && !level2 && !level3) {
                alert('Please select at least one column for module hierarchy');
                return;
            }

            moduleLevel1 = level1;
            moduleLevel2 = level2;
            moduleLevel3 = level3;

            buildModuleHierarchy();
        }

        // build module hierarchy
        function buildModuleHierarchy() {
            const hierarchy = {};

            // iterate all logs in raw cache for module hierarchy
            rawCache.forEach(log => {
                let path = [];

            // add path elements according to configured levels
                if (moduleLevel1 && log[moduleLevel1]) {
                    path.push(log[moduleLevel1]);
                }
                if (moduleLevel2 && log[moduleLevel2]) {
                    path.push(log[moduleLevel2]);
                }
                if (moduleLevel3 && log[moduleLevel3]) {
                    path.push(log[moduleLevel3]);
                }

                // build tree structure - add empty path check
                if (path.length > 0) {
                    let currentLevel = hierarchy;
                    path.forEach((segment, index) => {
                        // ensure segment is a valid string
                        const seg = String(segment).trim();
                        if (!seg) return; // skip empty segment

                        if (!currentLevel[seg]) {
                            currentLevel[seg] = {};
                        }
                        currentLevel = currentLevel[seg];
                    });
                }
            });

            moduleHierarchy = hierarchy;

            // build node-has-children mapping and all path list
            nodeHasChildrenMap = new Map();
            allModulePaths = [];
            traverseHierarchy(moduleHierarchy, '');

            renderModuleTree(moduleHierarchy);
        }

        // traverse hierarchy and fill mapping
        function traverseHierarchy(node, parentPath) {
            if (!node || typeof node !== 'object') return;

            Object.entries(node).forEach(([name, children]) => {
                const fullPath = parentPath ? `${parentPath}.${name}` : name;
                allModulePaths.push(fullPath);

                const hasChildren = children && Object.keys(children).length > 0;
                nodeHasChildrenMap.set(fullPath, hasChildren);

                if (hasChildren) {
                    traverseHierarchy(children, fullPath);
                }
            });
        }

        function initModuleSystem() {
            // generate module hierarchy
            // buildModuleHierarchy();

            // initially select all root nodes
            selectedModules = Object.keys(moduleHierarchy);

            // render module tree
            renderModuleTree(moduleHierarchy);
        }

        function renderModuleTree(hierarchy) {
            const box = document.getElementById('moduleTree');
            box.innerHTML = '';

            // recursively render node
            function renderNode(name, children, depth = 0, parentPath = '') {
                const fullPath = parentPath ? `${parentPath}.${name}` : name;
                const hasChildren = children && Object.keys(children).length > 0;

                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'tree-node';

                const labelDiv = document.createElement('div');
                labelDiv.className = 'tree-label';
                labelDiv.innerHTML = `
                    <span class="tree-toggle ${hasChildren ? '' : 'invisible'}">
                        <i class="fas fa-chevron-down"></i>
                    </span>
                    <input type="checkbox" class="tree-checkbox" id="mod-${fullPath}"
                           data-path="${fullPath}" ${selectedModules.includes(fullPath) ? 'checked' : ''}>
                    <label for="mod-${fullPath}" class="flex-grow-1">${name}</label>
                `;

                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';

                if (hasChildren) {
                    Object.entries(children).forEach(([childName, childData]) => {
                        childrenDiv.appendChild(renderNode(childName, childData, depth + 1, fullPath));
                    });
                }

                // expand/collapse interaction
                if (hasChildren) {
                    const toggleIcon = labelDiv.querySelector('.tree-toggle');
                    toggleIcon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        childrenDiv.classList.toggle('expanded');
                        toggleIcon.classList.toggle('collapsed');
                    });

                    childrenDiv.classList.add('expanded');
                }

                nodeDiv.appendChild(labelDiv);
                nodeDiv.appendChild(childrenDiv);
                return nodeDiv;
            }

            // render root nodes
            Object.entries(hierarchy).forEach(([name, children]) => {
                box.appendChild(renderNode(name, children));
            });
        }

        /**
         * recompute selectedModules: parent checked covers subtree, leaf checked needs full path
         * recompute selectedModules
         */
        function rebuildSelectedModules() {
            // 1. collect all checked nodes
            const checked = Array.from(document.querySelectorAll('.tree-checkbox:checked'))
                                .map(cb => cb.dataset.path);

            // 2. remove redundant nodes covered by ancestor
            const minimal = [];
            checked.sort();   // ensure shorter paths first
            for (const path of checked) {
                // skip if an ancestor is already selected
                const hasAncestor = minimal.some(m => path.startsWith(m + '.'));
                if (!hasAncestor) {
                    minimal.push(path);
                }
            }

            // 3. append .* to non-leaf nodes, keep leaves as-is
            selectedModules = minimal.map(p => {
                return nodeHasChildrenMap.get(p) ? p + '.*' : p;
            });
        }

        function isLogVisible(log) {
            if (!log) return false;

            // 1. level filter
            if (!selectedLevels.includes(log.levelname)) return false;

            // 2. module filter
            if (selectedModules.length === 0) return true;

            // 3. build full module string from log
            const segs = [];
            if (moduleLevel1 && log[moduleLevel1]) segs.push(log[moduleLevel1]);
            if (moduleLevel2 && log[moduleLevel2]) segs.push(log[moduleLevel2]);
            if (moduleLevel3 && log[moduleLevel3]) segs.push(log[moduleLevel3]);
            const moduleStr = segs.join('.');

            // 4. any rule satisfied is enough
            // visibility depends on Include / Exclude mode
            const hit = selectedModules.some(rule => {
                if (rule.endsWith('.*')) {
                const prefix = rule.slice(0, -2);
                return moduleStr === prefix || moduleStr.startsWith(prefix + '.');
                } else {
                    return moduleStr === rule;
                }
            });
            return moduleFilterMode === 'include' ? hit : !hit;
        }

        function toggleAllModules(selectAll = true) {
            if (selectAll) {
                // select all nodes
                selectedModules = [...allModulePaths];
            } else {
                selectedModules = [];
            }

            // update all checkbox states
            document.querySelectorAll('.tree-checkbox').forEach(checkbox => {
                checkbox.checked = selectAll;
            });
        }

        /**
         * NEW: Iterates through the DOM to apply filters by hiding/showing rows.
         */
        function applyFiltersToDOM() {
            const rows = logTableBody.querySelectorAll('tr[data-log-id]');
            let visibleCount = 0;
            rows.forEach(row => {
                const logId = parseInt(row.dataset.logId, 10);
                const log = rawCacheMap.get(logId);
                if (isLogVisible(log)) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            
            // Update the displayed entry count
            totalEntries = visibleCount;
            document.getElementById('entryCount').textContent = `${visibleCount.toLocaleString()} Entries`;
        }

        function applyFilters() {
            moduleFilterMode = document.querySelector('input[name="moduleMode"]:checked').value;

            // 1. Update filter state from UI (no visual change yet)
            updateSelectedLevels();
            rebuildSelectedModules();
            updateFilterStatus();

            // 2. Apply the new filters to the existing DOM
            console.log("Applying filters by toggling visibility...");
            applyFiltersToDOM();

            // NOTE: Do NOT restart the SSE connection here. Filters are a pure
            // client-side concern (display:none). Reconnecting would drop any logs
            // that arrive during the brief disconnection window.
            // If backend-level filtering is ever added, the reconnect logic
            // should be reintroduced with a proper filter parameter.

            updateDebugInfo();
        }

        // Update selected levels from checkboxes
        function updateSelectedLevels() {
            selectedLevels = Array.from(document.querySelectorAll('.level-checkbox:checked'))
                .map(checkbox => checkbox.value.toUpperCase());
            console.log('Selected levels:', selectedLevels);
        }

        // Update filter status display
        function updateFilterStatus() {
            const levelText = selectedLevels.length === 5 ? 'ALL' : selectedLevels.join(', ');
            const moduleText = selectedModules.length > 0 ? ` | Modules: ${selectedModules.length}` : '';
            document.getElementById('filterStatus').textContent = levelText + moduleText;
        }
    </script>
</body>
</html>
