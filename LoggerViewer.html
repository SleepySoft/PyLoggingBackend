         * recompute selectedModules
         */
        function rebuildSelectedModules() {
            // 1. collect all checked nodes
            const checked = Array.from(document.querySelectorAll('.tree-checkbox:checked'))
                                .map(cb => cb.dataset.path);

            // 2. remove redundant nodes covered by ancestor
            const minimal = [];
            checked.sort();   // ensure shorter paths first
            for (const path of checked) {
                // skip if an ancestor is already selected
                const hasAncestor = minimal.some(m => path.startsWith(m + '.'));
                if (!hasAncestor) {
                    minimal.push(path);
                }
            }

            // 3. append .* to non-leaf nodes, keep leaves as-is
            selectedModules = minimal.map(p => {
                return nodeHasChildrenMap.get(p) ? p + '.*' : p;
            });
        }

        function isLogVisible(log) {
            if (!log) return false;

            // 1. level filter
            if (!selectedLevels.includes(log.levelname)) return false;

            // 2. module filter
            if (selectedModules.length === 0) return true;

            // 3. build full module string from log
            const segs = [];
            if (moduleLevel1 && log[moduleLevel1]) segs.push(log[moduleLevel1]);
            if (moduleLevel2 && log[moduleLevel2]) segs.push(log[moduleLevel2]);
            if (moduleLevel3 && log[moduleLevel3]) segs.push(log[moduleLevel3]);
            const moduleStr = segs.join('.');

            // 4. any rule satisfied is enough
            // visibility depends on Include / Exclude mode
            const hit = selectedModules.some(rule => {
                if (rule.endsWith('.*')) {
                const prefix = rule.slice(0, -2);
                return moduleStr === prefix || moduleStr.startsWith(prefix + '.');
                } else {
                    return moduleStr === rule;
                }
            });
            return moduleFilterMode === 'include' ? hit : !hit;
        }

        function toggleAllModules(selectAll = true) {
            if (selectAll) {
                // select all nodes
                selectedModules = [...allModulePaths];
            } else {
                selectedModules = [];
            }

            // update all checkbox states
            document.querySelectorAll('.tree-checkbox').forEach(checkbox => {
                checkbox.checked = selectAll;
            });
        }

        /**
         * NEW: Iterates through the DOM to apply filters by hiding/showing rows.
         */
        function applyFiltersToDOM() {
            const rows = logTableBody.querySelectorAll('tr[data-log-id]');
            let visibleCount = 0;
            rows.forEach(row => {
                const logId = parseInt(row.dataset.logId, 10);
                const log = logCacheMap.get(logId);
                if (isLogVisible(log)) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            
            // Update the displayed entry count
            totalEntries = visibleCount;
            document.getElementById('entryCount').textContent = `${visibleCount.toLocaleString()} Entries`;
        }

        function applyFilters() {
            moduleFilterMode = document.querySelector('input[name="moduleMode"]:checked').value;

            // 1. Update filter state from UI (no visual change yet)
            updateSelectedLevels();
            rebuildSelectedModules();
            updateFilterStatus();

            // 2. Apply the new filters to the existing DOM
            console.log("Applying filters by toggling visibility...");
            applyFiltersToDOM();

            // 3. Restart SSE with new filters if it's active
            if (document.getElementById('autoRefresh').checked) {
                if (eventSource) {
                    eventSource.close();
                }
                setupEventSource();
            }
        }

        // Update selected levels from checkboxes
        function updateSelectedLevels() {
            selectedLevels = Array.from(document.querySelectorAll('.level-checkbox:checked'))
                .map(checkbox => checkbox.value.toUpperCase());
            console.log('Selected levels:', selectedLevels);
        }

        // Update filter status display
        function updateFilterStatus() {
            const levelText = selectedLevels.length === 5 ? 'ALL' : selectedLevels.join(', ');
            const moduleText = selectedModules.length > 0 ? ` | Modules: ${selectedModules.length}` : '';
            document.getElementById('filterStatus').textContent = levelText + moduleText;
        }
    </script>
</body>
